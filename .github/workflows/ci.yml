name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

defaults:
  run:
    working-directory: taskcode-marketplace/plugins/taskcode-plugin

jobs:
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test

      # Guard de E6 (TASK-031). dist/src se versiona para que un clon
      # traiga un taskctl que arranque, y el precio de eso es que se
      # puede desincronizar de src/. Este step lo impide.
      #
      # Corre en los DOS jobs a proposito: el modo de fallo es
      # cross-plataforma (tsc emite CRLF en Windows y las plantillas
      # multilinea de src/ viajan tal cual al build), asi que un guard
      # que solo corriera en Linux no discriminaria justo el caso que
      # motivo el .gitattributes.
      - name: "Guard E6: dist/src commiteado == dist/src recompilado"
        shell: bash
        run: |
          npm run build
          sucio="$(git status --porcelain -- dist/src)"
          if [ -n "$sucio" ]; then
            echo "::error::dist/src no coincide con lo que produce src/. Ejecuta 'npm run build' y commitea dist/src."
            echo "$sucio"
            git --no-pager diff -- dist/src | head -50
            exit 1
          fi
          echo "dist/src esta al dia."

  test-windows:
    name: Tests + validacion nativa (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build

      # Mismo guard que en Linux. Aqui es donde de verdad se juega: si el
      # .gitattributes no fijara el eol, este step se pondria rojo con un
      # diff de todo dist/src aunque nadie hubiera tocado src/.
      - name: "Guard E6: dist/src commiteado == dist/src recompilado"
        shell: bash
        run: |
          sucio="$(git status --porcelain -- dist/src)"
          if [ -n "$sucio" ]; then
            echo "::error::dist/src no coincide con lo que produce src/. Ejecuta 'npm run build' y commitea dist/src."
            echo "$sucio"
            git --no-pager diff -- dist/src | head -50
            exit 1
          fi
          echo "dist/src esta al dia."

      # Cada pregunta abierta es un step que ASEVERA su hipotesis: el
      # verde/rojo del step ES la respuesta, legible por la API sin
      # necesidad de bajar los logs. Todos van con continue-on-error para
      # que una respuesta negativa no tire el job entero.

      - name: "Q1 (TASK-006): bin/taskctl conserva el bit +x tras checkout nativo"
        shell: bash
        continue-on-error: true
        run: |
          git ls-files -s bin/taskctl
          ls -la bin/taskctl
          test -x bin/taskctl

      - name: "Q2 (TASK-006): taskctl resuelve como comando suelto via PATH"
        shell: bash
        continue-on-error: true
        run: |
          export PATH="$(pwd)/bin:$PATH"
          taskctl --version

      - name: "Q3 (TASK-007): los .sh de Git-Flow corren bajo Git Bash nativo"
        shell: bash
        continue-on-error: true
        run: |
          bash --version | head -1
          bash scripts/gitflow/test/smoke-test.sh

      - name: "Q4: la suite completa pasa en Windows"
        continue-on-error: true
        run: npm test

      - name: "Q5: node bin/taskctl funciona desde cmd.exe (sin Git Bash)"
        shell: cmd
        continue-on-error: true
        run: node bin\taskctl --version

  validate-plugin:
    name: claude plugin validate
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Claude Code CLI
        working-directory: .
        run: npm install -g @anthropic-ai/claude-code
      - name: Validar el manifiesto del plugin
        working-directory: .
        run: claude plugin validate ./taskcode-marketplace/plugins/taskcode-plugin
      - name: Validar el marketplace
        working-directory: .
        run: claude plugin validate .
