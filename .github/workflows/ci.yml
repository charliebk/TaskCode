name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

defaults:
  run:
    working-directory: taskcode-marketplace/plugins/taskcode-plugin

jobs:
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test

      # Guard de E6 (TASK-031). dist/src se versiona para que un clon
      # traiga un taskctl que arranque, y el precio de eso es que se
      # puede desincronizar de src/. Este step lo impide.
      #
      # Corre en los DOS jobs a proposito: el modo de fallo es
      # cross-plataforma (tsc emite CRLF en Windows y las plantillas
      # multilinea de src/ viajan tal cual al build), asi que un guard
      # que solo corriera en Linux no discriminaria justo el caso que
      # motivo el .gitattributes.
      - name: "Guard E6: dist/src commiteado == dist/src recompilado"
        shell: bash
        run: |
          # rm -rf antes de compilar: tsc no purga outDir, asi que sin esto
          # un modulo borrado de src/ dejaria su .js commiteado para siempre
          # y el guard seguiria en verde (hallazgo de revision por pares).
          rm -rf dist/src
          npm run build
          # Se compara contra el INDICE, no con "git status --porcelain".
          # En un worktree heredado los .ts pueden seguir en CRLF en disco,
          # tsc los arrastra a las plantillas del build, y status marca " M"
          # aunque el blob normalizado sea identico: falso positivo que
          # ademas deja el workspace sucio y bloquea el guard de la 8.3 de
          # taskctl. El "add" aplica el filtro clean y desambigua. Y a
          # diferencia de "git diff --exit-code" a secas, esto SI ve los
          # ficheros nuevos y los borrados.
          #
          # El -f es necesario: sin el, "git add -A" salta en silencio lo que
          # cualquier .gitignore excluya, y los patrones de directorio sin
          # ancla ("tareas/", "logs/", "node_modules/") casan a cualquier
          # profundidad, tambien DENTRO de dist/src. Un modulo en src/tareas/
          # no llegaria al commit y el guard diria "al dia" mientras el clon
          # queda roto.
          git add -A -f -- dist/src
          rc=0
          if ! git diff --cached --quiet -- dist/src; then
            echo "::error::dist/src no coincide con lo que produce src/. Ejecuta 'npm run build' y commitea dist/src."
            git --no-pager diff --cached --stat -- dist/src
            # Cuando la deriva es de fin de linea el diff sale vacio, asi
            # que se imprime tambien el eol real de cada fichero.
            git ls-files --eol -- dist/src | grep -v 'w/lf' || true
            rc=1
          else
            echo "dist/src esta al dia."
          fi
          # El indice se deja como estaba: en CI da igual, pero este snippet
          # se copia a maquinas de desarrollo y ahi no debe tocar el estado
          # de git de nadie.
          git reset -q -- dist/src
          exit $rc

  test-windows:
    name: Tests + validacion nativa (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build

      # Mismo guard que en Linux, y autocontenido igual que aquel: compila
      # el mismo, sin apoyarse en el step anterior. Si dependiera de el,
      # bastaria con reordenarlo o condicionarlo para que este siguiera en
      # verde sin haber recompilado nada — sobre un checkout limpio la
      # comparacion es trivialmente vacia.
      #
      # Aqui es donde de verdad se juega: si el .gitattributes no fijara el
      # eol, este step se pondria rojo con todo dist/src cambiado aunque
      # nadie hubiera tocado src/.
      - name: "Guard E6: dist/src commiteado == dist/src recompilado"
        shell: bash
        run: |
          rm -rf dist/src
          npm run build
          # El -f es necesario: sin el, "git add -A" salta en silencio lo que
          # cualquier .gitignore excluya, y los patrones de directorio sin
          # ancla ("tareas/", "logs/", "node_modules/") casan a cualquier
          # profundidad, tambien DENTRO de dist/src. Un modulo en
          # src/tareas/ no llegaria al commit y el guard diria "al dia"
          # mientras el clon queda roto.
          git add -A -f -- dist/src
          rc=0
          if ! git diff --cached --quiet -- dist/src; then
            echo "::error::dist/src no coincide con lo que produce src/. Ejecuta 'npm run build' y commitea dist/src."
            git --no-pager diff --cached --stat -- dist/src
            # Cuando la deriva es de fin de linea el diff sale vacio, asi
            # que se imprime tambien el eol real de cada fichero.
            git ls-files --eol -- dist/src | grep -v 'w/lf' || true
            rc=1
          else
            echo "dist/src esta al dia."
          fi
          # El indice se deja como estaba: en CI da igual, pero este snippet
          # se copia a maquinas de desarrollo y ahi no debe tocar el estado
          # de git de nadie.
          git reset -q -- dist/src
          exit $rc

      # Cada pregunta abierta es un step que ASEVERA su hipotesis: el
      # verde/rojo del step ES la respuesta, legible por la API sin
      # necesidad de bajar los logs. Todos van con continue-on-error para
      # que una respuesta negativa no tire el job entero.

      - name: "Q1 (TASK-006): bin/taskctl conserva el bit +x tras checkout nativo"
        shell: bash
        continue-on-error: true
        run: |
          git ls-files -s bin/taskctl
          ls -la bin/taskctl
          test -x bin/taskctl

      - name: "Q2 (TASK-006): taskctl resuelve como comando suelto via PATH"
        shell: bash
        continue-on-error: true
        run: |
          export PATH="$(pwd)/bin:$PATH"
          taskctl --version

      - name: "Q3 (TASK-007): los .sh de Git-Flow corren bajo Git Bash nativo"
        shell: bash
        continue-on-error: true
        run: |
          bash --version | head -1
          bash scripts/gitflow/test/smoke-test.sh

      - name: "Q4: la suite completa pasa en Windows"
        continue-on-error: true
        run: npm test

      - name: "Q5: node bin/taskctl funciona desde cmd.exe (sin Git Bash)"
        shell: cmd
        continue-on-error: true
        run: node bin\taskctl --version

  validate-plugin:
    name: claude plugin validate
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Claude Code CLI
        working-directory: .
        run: npm install -g @anthropic-ai/claude-code
      - name: Validar el manifiesto del plugin
        working-directory: .
        run: claude plugin validate ./taskcode-marketplace/plugins/taskcode-plugin
      - name: Validar el marketplace
        working-directory: .
        run: claude plugin validate .
